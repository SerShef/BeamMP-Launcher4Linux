name: release_all_bin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake'
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Strip and checksum
        run: |
          strip -s build/BeamMP-Launcher
          cd build && sha256sum BeamMP-Launcher > BeamMP-Launcher.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-linux
          path: |
            build/BeamMP-Launcher
            build/BeamMP-Launcher.sha256
      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BeamMP-Launcher
            build/BeamMP-Launcher.sha256

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake' -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Archive Windows binary
        run: |
          cd build/Release
          sha256sum BeamMP-Launcher.exe > BeamMP-Launcher.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-windows
          path: |
            build/Release/BeamMP-Launcher.exe
            build/Release/BeamMP-Launcher.exe.sha256
      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/BeamMP-Launcher.exe
            build/Release/BeamMP-Launcher.exe.sha256


  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake' -DVCPKG_TARGET_TRIPLET=arm64-osx
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Strip and checksum
        id: strip
        run: |
          echo "=== Listing build directory ==="
          find build -type f -name "*" | sort
          BIN=$(find build -name "BeamMP-Launcher" -type f | head -1)
          echo "BIN='$BIN'"
          if [ -z "$BIN" ]; then echo "Binary not found"; exit 1; fi
          echo "File exists: $(test -f "$BIN" && echo yes || echo no)"
          echo "File size: $(stat -c%s "$BIN" 2>/dev/null || stat -f%z "$BIN" 2>/dev/null || echo unknown)"
          strip "$BIN"
          SHA="${BIN}.sha256"
          cd "$(dirname "$BIN")" && shasum -a 256 "$(basename "$BIN")" > "$(basename "$BIN").sha256"
          echo "bin=$BIN" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-macos
          path: |
            ${{ steps.strip.outputs.bin }}
            ${{ steps.strip.outputs.sha }}
      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.strip.outputs.bin }}
            ${{ steps.strip.outputs.sha }}
