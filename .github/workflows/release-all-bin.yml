name: release_all_bin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'
      - uses: lukka/run-vcpkg@v7
        with:
          vcpkgArguments: 'zlib nlohmann-json openssl cpp-httplib[openssl]'
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake'
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Strip and checksum
        run: |
          strip -s build/BeamMP-Launcher
          cd build && sha256sum BeamMP-Launcher > BeamMP-Launcher.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-linux
          path: |
            build/BeamMP-Launcher
            build/BeamMP-Launcher.sha256
      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BeamMP-Launcher
            build/BeamMP-Launcher.sha256

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'
      - uses: lukka/run-vcpkg@v7
        with:
          vcpkgArguments: 'zlib nlohmann-json openssl cpp-httplib[openssl]'
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
          vcpkgTriplet: 'x64-windows-static'
      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake' -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Archive Windows binary
        run: |
          cd build/Release
          sha256sum BeamMP-Launcher.exe > BeamMP-Launcher.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-windows
          path: |
            build/Release/BeamMP-Launcher.exe
            build/Release/BeamMP-Launcher.exe.sha256
      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/BeamMP-Launcher.exe
            build/Release/BeamMP-Launcher.exe.sha256
